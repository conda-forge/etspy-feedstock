{% set python_min = "3.11" %}
{% set name = "etspy" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/etspy-{{ version }}.tar.gz
  sha256: 598cadd27518bca07a95a7a8d59ef870f094416dac13ad18e499e231a5061634

build:
  number: 0

outputs:
  - name: etspy
    build:
      noarch: python
      script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python >={{ python_min }}
        - hatchling
        - pip
      run:
        - python >={{ python_min }}
        - numpy >=1.26.0,<3.0.0
        - pillow >=13.0.0
        - scikit-image >=0.26.0,<1.0.0
        - hyperspy-base >=2.1.1,<3.0.0
        - astra-toolbox >=2.1.0,<3.0.0
      run_constrained:
        - ipykernel >=6.29.5,<7.0.0
        - cupy >=13.3.0,<15.0.0
    test:
      imports:
        - etspy
        - etspy.api
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: etspy-gpu
    build:
      noarch: python
    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage('etspy', exact=True) }}
        - cupy >=13.3.0,<15.0.0
    test:
      imports:
        - etspy
        - etspy.api
        - cupy
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

about:
  home: https://pages.nist.gov/etspy/
  summary: Suite of tools for processing and reconstruction of electron tomography data
  dev_url: https://github.com/usnistgov/etspy
  license: NIST-PD-fallback
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jat255
    - AndrewHerzing
